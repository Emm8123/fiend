<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fiend — Sistema de Servicios</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Navigation bottom */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      border: none;
      background: none;
      cursor: pointer;
      transition: color 0.2s;
      min-width: 64px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    /* Main content */
    .main {
      padding: 16px;
      padding-bottom: 90px;
      max-width: 640px;
      margin: 0 auto;
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
    }

    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      width: auto;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* Lists */
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:active {
      background: var(--bg-hover);
    }

    .list-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a;
      flex-shrink: 0;
    }

    .list-content {
      flex: 1;
      min-width: 0;
    }

    .list-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-pending { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .badge-process { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .badge-ready { background: rgba(52, 211, 153, 0.15); color: var(--success); }
    .badge-done { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-hover);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Section header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* Status selector */
    .status-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }

    /* Invoice preview */
    .invoice-preview {
      background: white;
      color: #1e293b;
      padding: 24px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .invoice-preview h2 {
      color: #0f172a;
      margin-bottom: 4px;
    }

    .invoice-preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }

    .invoice-preview th, .invoice-preview td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .invoice-preview th {
      font-weight: 600;
      color: #64748b;
      font-size: 0.8rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Search */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      padding-left: 40px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Responsive */
    @media (min-width: 640px) {
      .nav {
        max-width: 640px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 16px 16px 0 0;
      }
    }

    /* Print styles for invoices */
    @media print {
      body * { visibility: hidden; }
      .invoice-print, .invoice-print * { visibility: visible; }
      .invoice-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
        color: black;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">F</div>
      <span>Fiend</span>
    </div>
    <button class="btn-icon" onclick="exportData()" title="Exportar datos">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </header>

  <main class="main">
    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page active">
      <div class="stats-grid">
        <div class="card">
          <div class="card-title">Clientes</div>
          <div class="card-value" id="stat-clients">0</div>
        </div>
        <div class="card">
          <div class="card-title">Servicios</div>
          <div class="card-value" id="stat-services">0</div>
        </div>
        <div class="card">
          <div class="card-title">En proceso</div>
          <div class="card-value" id="stat-process" style="color: var(--primary)">0</div>
        </div>
        <div class="card">
          <div class="card-title">Ingresos</div>
          <div class="card-value" id="stat-revenue" style="color: var(--success)">$0</div>
        </div>
      </div>

      <div class="section-header">
        <h2 class="section-title">Servicios recientes</h2>
        <button class="btn btn-sm btn-primary" onclick="openServiceModal()">+ Nuevo</button>
      </div>
      <div id="recent-services"></div>
    </div>

    <!-- CLIENTES -->
    <div id="page-clients" class="page">
      <div class="section-header">
        <h2 class="section-title">Clientes</h2>
        <button class="btn btn-sm btn-primary" onclick="openClientModal()">+ Agregar</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="form-input" id="search-clients" placeholder="Buscar cliente..." oninput="renderClients()">
      </div>
      <div id="clients-list"></div>
    </div>

    <!-- SERVICIOS -->
    <div id="page-services" class="page">
      <div class="section-header">
        <h2 class="section-title">Servicios / Tareas</h2>
        <button class="btn btn-sm btn-primary" onclick="openServiceModal()">+ Nuevo</button>
      </div>
      <div class="status-pills">
        <button class="pill active" data-status="all" onclick="filterServices('all', this)">Todos</button>
        <button class="pill" data-status="pending" onclick="filterServices('pending', this)">Pendiente</button>
        <button class="pill" data-status="process" onclick="filterServices('process', this)">En proceso</button>
        <button class="pill" data-status="ready" onclick="filterServices('ready', this)">Listo</button>
        <button class="pill" data-status="done" onclick="filterServices('done', this)">Entregado</button>
      </div>
      <div id="services-list"></div>
    </div>

    <!-- FACTURAS -->
    <div id="page-invoices" class="page">
      <div class="section-header">
        <h2 class="section-title">Facturas</h2>
        <button class="btn btn-sm btn-primary" onclick="openInvoiceModal()">+ Crear</button>
      </div>
      <div id="invoices-list"></div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="nav">
    <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Inicio
    </button>
    <button class="nav-item" data-page="clients" onclick="navigate('clients')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Clientes
    </button>
    <button class="nav-item" data-page="services" onclick="navigate('services')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      Servicios
    </button>
    <button class="nav-item" data-page="invoices" onclick="navigate('invoices')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Facturas
    </button>
  </nav>

  <!-- Modal Cliente -->
  <div class="modal-overlay" id="modal-client">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="client-modal-title">Nuevo Cliente</h3>
        <button class="close-btn" onclick="closeModal('modal-client')">×</button>
      </div>
      <form id="form-client" onsubmit="saveClient(event)">
        <input type="hidden" id="client-id">
        <div class="form-group">
          <label class="form-label">Nombre completo *</label>
          <input type="text" class="form-input" id="client-name" required placeholder="Ej: Juan Pérez">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="client-email" placeholder="juan@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-input" id="client-phone" placeholder="+54 9 11 1234-5678">
        </div>
        <div class="form-group">
          <label class="form-label">Universidad / Institución</label>
          <input type="text" class="form-input" id="client-uni" placeholder="Ej: UBA, UTN...">
        </div>
        <div class="form-group">
          <label class="form-label">Notas</label>
          <textarea class="form-textarea" id="client-notes" placeholder="Información adicional..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
        <button type="button" class="btn btn-danger" style="margin-top:8px;display:none" id="btn-delete-client" onclick="deleteClient()">Eliminar</button>
      </form>
    </div>
  </div>

  <!-- Modal Servicio -->
  <div class="modal-overlay" id="modal-service">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="service-modal-title">Nuevo Servicio</h3>
        <button class="close-btn" onclick="closeModal('modal-service')">×</button>
      </div>
      <form id="form-service" onsubmit="saveService(event)">
        <input type="hidden" id="service-id">
        <div class="form-group">
          <label class="form-label">Cliente *</label>
          <select class="form-select" id="service-client" required>
            <option value="">Seleccionar cliente...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Título / Descripción *</label>
          <input type="text" class="form-input" id="service-title" required placeholder="Ej: Trabajo práctico Álgebra">
        </div>
        <div class="form-group">
          <label class="form-label">Detalles</label>
          <textarea class="form-textarea" id="service-details" placeholder="Materia, requisitos, fecha de entrega..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Precio ($)</label>
          <input type="number" class="form-input" id="service-price" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select class="form-select" id="service-status">
            <option value="pending">Pendiente</option>
            <option value="process">En proceso</option>
            <option value="ready">Listo</option>
            <option value="done">Entregado</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Fecha de entrega</label>
          <input type="date" class="form-input" id="service-due">
        </div>
        <button type="submit" class="btn btn-primary">Guardar Servicio</button>
        <button type="button" class="btn btn-danger" style="margin-top:8px;display:none" id="btn-delete-service" onclick="deleteService()">Eliminar</button>
      </form>
    </div>
  </div>

  <!-- Modal Factura -->
  <div class="modal-overlay" id="modal-invoice">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Nueva Factura</h3>
        <button class="close-btn" onclick="closeModal('modal-invoice')">×</button>
      </div>
      <form id="form-invoice" onsubmit="saveInvoice(event)">
        <div class="form-group">
          <label class="form-label">Cliente *</label>
          <select class="form-select" id="invoice-client" required onchange="loadClientServices()">
            <option value="">Seleccionar cliente...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Servicios a facturar</label>
          <div id="invoice-services-checkboxes" style="max-height:150px;overflow-y:auto"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Notas / Concepto</label>
          <textarea class="form-textarea" id="invoice-notes" placeholder="Servicios académicos..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Generar Factura</button>
      </form>
    </div>
  </div>

  <!-- Modal Ver Factura -->
  <div class="modal-overlay" id="modal-view-invoice">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Factura</h3>
        <button class="close-btn" onclick="closeModal('modal-view-invoice')">×</button>
      </div>
      <div id="invoice-content"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" onclick="printInvoice()">🖨️ Imprimir / PDF</button>
        <button class="btn btn-secondary" onclick="closeModal('modal-view-invoice')">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ==================== DATA ====================
    const STORAGE_KEY = 'fiend_data_v1';

    let data = {
      clients: [],
      services: [],
      invoices: [],
      nextIds: { client: 1, service: 1, invoice: 1 }
    };

    let currentFilter = 'all';
    let editingId = null;

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) data = JSON.parse(saved);
      } catch (e) {
        console.error('Error loading data', e);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ==================== NAVIGATION ====================
    function navigate(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelector(`[data-page="${page}"]`).classList.add('active');
      
      if (page === 'dashboard') renderDashboard();
      if (page === 'clients') renderClients();
      if (page === 'services') renderServices();
      if (page === 'invoices') renderInvoices();
    }

    // ==================== TOAST ====================
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ==================== MODALS ====================
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      editingId = null;
    }

    // ==================== CLIENTS ====================
    function openClientModal(id = null) {
      editingId = id;
      const form = document.getElementById('form-client');
      form.reset();
      document.getElementById('client-id').value = '';
      document.getElementById('btn-delete-client').style.display = 'none';
      document.getElementById('client-modal-title').textContent = 'Nuevo Cliente';

      if (id) {
        const c = data.clients.find(x => x.id === id);
        if (c) {
          document.getElementById('client-id').value = c.id;
          document.getElementById('client-name').value = c.name;
          document.getElementById('client-email').value = c.email || '';
          document.getElementById('client-phone').value = c.phone || '';
          document.getElementById('client-uni').value = c.uni || '';
          document.getElementById('client-notes').value = c.notes || '';
          document.getElementById('client-modal-title').textContent = 'Editar Cliente';
          document.getElementById('btn-delete-client').style.display = 'block';
        }
      }
      openModal('modal-client');
    }

    function saveClient(e) {
      e.preventDefault();
      const id = document.getElementById('client-id').value;
      const client = {
        id: id ? parseInt(id) : data.nextIds.client++,
        name: document.getElementById('client-name').value.trim(),
        email: document.getElementById('client-email').value.trim(),
        phone: document.getElementById('client-phone').value.trim(),
        uni: document.getElementById('client-uni').value.trim(),
        notes: document.getElementById('client-notes').value.trim(),
        createdAt: id ? (data.clients.find(c => c.id == id)?.createdAt || Date.now()) : Date.now()
      };

      if (id) {
        const idx = data.clients.findIndex(c => c.id == id);
        data.clients[idx] = client;
        showToast('Cliente actualizado');
      } else {
        data.clients.push(client);
        showToast('Cliente agregado');
      }
      saveData();
      closeModal('modal-client');
      renderClients();
      renderDashboard();
    }

    function deleteClient() {
      const id = parseInt(document.getElementById('client-id').value);
      if (!confirm('¿Eliminar este cliente? Los servicios asociados permanecerán.')) return;
      data.clients = data.clients.filter(c => c.id !== id);
      saveData();
      closeModal('modal-client');
      renderClients();
      renderDashboard();
      showToast('Cliente eliminado');
    }

    function renderClients() {
      const q = (document.getElementById('search-clients')?.value || '').toLowerCase();
      let list = data.clients;
      if (q) list = list.filter(c => 
        c.name.toLowerCase().includes(q) || 
        (c.email || '').toLowerCase().includes(q) ||
        (c.uni || '').toLowerCase().includes(q)
      );

      const el = document.getElementById('clients-list');
      if (list.length === 0) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">👤</div><p>No hay clientes aún.<br>Agrega tu primer cliente.</p></div>`;
        return;
      }

      el.innerHTML = list.map(c => `
        <div class="list-item" onclick="openClientModal(${c.id})">
          <div class="list-avatar">${c.name.charAt(0).toUpperCase()}</div>
          <div class="list-content">
            <div class="list-title">${escapeHtml(c.name)}</div>
            <div class="list-subtitle">${escapeHtml(c.uni || c.email || c.phone || 'Sin info')}</div>
          </div>
        </div>
      `).join('');
    }

    // ==================== SERVICES ====================
    function openServiceModal(id = null) {
      editingId = id;
      const form = document.getElementById('form-service');
      form.reset();
      document.getElementById('service-id').value = '';
      document.getElementById('btn-delete-service').style.display = 'none';
      document.getElementById('service-modal-title').textContent = 'Nuevo Servicio';

      // Populate clients
      const select = document.getElementById('service-client');
      select.innerHTML = '<option value="">Seleccionar cliente...</option>' +
        data.clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

      if (id) {
        const s = data.services.find(x => x.id === id);
        if (s) {
          document.getElementById('service-id').value = s.id;
          document.getElementById('service-client').value = s.clientId;
          document.getElementById('service-title').value = s.title;
          document.getElementById('service-details').value = s.details || '';
          document.getElementById('service-price').value = s.price || '';
          document.getElementById('service-status').value = s.status;
          document.getElementById('service-due').value = s.due || '';
          document.getElementById('service-modal-title').textContent = 'Editar Servicio';
          document.getElementById('btn-delete-service').style.display = 'block';
        }
      }
      openModal('modal-service');
    }

    function saveService(e) {
      e.preventDefault();
      const id = document.getElementById('service-id').value;
      const service = {
        id: id ? parseInt(id) : data.nextIds.service++,
        clientId: parseInt(document.getElementById('service-client').value),
        title: document.getElementById('service-title').value.trim(),
        details: document.getElementById('service-details').value.trim(),
        price: parseFloat(document.getElementById('service-price').value) || 0,
        status: document.getElementById('service-status').value,
        due: document.getElementById('service-due').value,
        createdAt: id ? (data.services.find(s => s.id == id)?.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };

      if (id) {
        const idx = data.services.findIndex(s => s.id == id);
        data.services[idx] = service;
        showToast('Servicio actualizado');
      } else {
        data.services.push(service);
        showToast('Servicio creado');
      }
      saveData();
      closeModal('modal-service');
      renderServices();
      renderDashboard();
    }

    function deleteService() {
      const id = parseInt(document.getElementById('service-id').value);
      if (!confirm('¿Eliminar este servicio?')) return;
      data.services = data.services.filter(s => s.id !== id);
      saveData();
      closeModal('modal-service');
      renderServices();
      renderDashboard();
      showToast('Servicio eliminado');
    }

    function filterServices(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderServices();
    }

    function getStatusLabel(s) {
      const map = { pending: 'Pendiente', process: 'En proceso', ready: 'Listo', done: 'Entregado' };
      return map[s] || s;
    }

    function getStatusBadge(s) {
      return `<span class="badge badge-${s}">${getStatusLabel(s)}</span>`;
    }

    function getClientName(id) {
      const c = data.clients.find(x => x.id === id);
      return c ? c.name : 'Cliente eliminado';
    }

    function renderServices() {
      let list = [...data.services].sort((a, b) => b.updatedAt - a.updatedAt);
      if (currentFilter !== 'all') list = list.filter(s => s.status === currentFilter);

      const el = document.getElementById('services-list');
      if (list.length === 0) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>No hay servicios.<br>Crea uno nuevo.</p></div>`;
        return;
      }

      el.innerHTML = list.map(s => `
        <div class="list-item" onclick="openServiceModal(${s.id})">
          <div class="list-content">
            <div class="list-title">${escapeHtml(s.title)}</div>
            <div class="list-subtitle">${escapeHtml(getClientName(s.clientId))} ${s.price ? '· $' + s.price.toFixed(2) : ''}</div>
          </div>
          <div class="list-meta">${getStatusBadge(s.status)}</div>
        </div>
      `).join('');
    }

    // ==================== DASHBOARD ====================
    function renderDashboard() {
      document.getElementById('stat-clients').textContent = data.clients.length;
      document.getElementById('stat-services').textContent = data.services.length;
      document.getElementById('stat-process').textContent = data.services.filter(s => s.status === 'process').length;
      
      const revenue = data.services
        .filter(s => s.status === 'done')
        .reduce((sum, s) => sum + (s.price || 0), 0);
      document.getElementById('stat-revenue').textContent = '$' + revenue.toFixed(0);

      const recent = [...data.services].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 5);
      const el = document.getElementById('recent-services');
      if (recent.length === 0) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">✨</div><p>Bienvenido a Fiend.<br>Agrega clientes y servicios para empezar.</p></div>`;
        return;
      }
      el.innerHTML = recent.map(s => `
        <div class="list-item" onclick="openServiceModal(${s.id})">
          <div class="list-content">
            <div class="list-title">${escapeHtml(s.title)}</div>
            <div class="list-subtitle">${escapeHtml(getClientName(s.clientId))}</div>
          </div>
          <div class="list-meta">${getStatusBadge(s.status)}</div>
        </div>
      `).join('');
    }

    // ==================== INVOICES ====================
    function openInvoiceModal() {
      const select = document.getElementById('invoice-client');
      select.innerHTML = '<option value="">Seleccionar cliente...</option>' +
        data.clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      document.getElementById('invoice-services-checkboxes').innerHTML = '';
      document.getElementById('invoice-notes').value = '';
      openModal('modal-invoice');
    }

    function loadClientServices() {
      const clientId = parseInt(document.getElementById('invoice-client').value);
      const services = data.services.filter(s => s.clientId === clientId && s.status !== 'done');
      const el = document.getElementById('invoice-services-checkboxes');
      if (services.length === 0) {
        el.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">No hay servicios pendientes para este cliente.</p>';
        return;
      }
      el.innerHTML = services.map(s => `
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer">
          <input type="checkbox" name="inv-service" value="${s.id}" data-price="${s.price || 0}" data-title="${escapeHtml(s.title)}">
          <span>${escapeHtml(s.title)} — $${(s.price || 0).toFixed(2)}</span>
        </label>
      `).join('');
    }

    function saveInvoice(e) {
      e.preventDefault();
      const clientId = parseInt(document.getElementById('invoice-client').value);
      const checks = document.querySelectorAll('input[name="inv-service"]:checked');
      if (checks.length === 0) {
        showToast('Selecciona al menos un servicio');
        return;
      }

      const items = Array.from(checks).map(c => ({
        serviceId: parseInt(c.value),
        title: c.dataset.title,
        price: parseFloat(c.dataset.price)
      }));

      const total = items.reduce((s, i) => s + i.price, 0);
      const invoice = {
        id: data.nextIds.invoice++,
        number: 'F-' + String(data.nextIds.invoice - 1).padStart(4, '0'),
        clientId,
        items,
        total,
        notes: document.getElementById('invoice-notes').value.trim(),
        date: new Date().toISOString().split('T')[0],
        createdAt: Date.now()
      };

      data.invoices.push(invoice);
      // Mark services as done
      items.forEach(i => {
        const s = data.services.find(x => x.id === i.serviceId);
        if (s) s.status = 'done';
      });
      saveData();
      closeModal('modal-invoice');
      renderInvoices();
      renderDashboard();
      showToast('Factura creada');
      viewInvoice(invoice.id);
    }

    function renderInvoices() {
      const list = [...data.invoices].sort((a, b) => b.createdAt - a.createdAt);
      const el = document.getElementById('invoices-list');
      if (list.length === 0) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">📄</div><p>No hay facturas aún.</p></div>`;
        return;
      }
      el.innerHTML = list.map(inv => `
        <div class="list-item" onclick="viewInvoice(${inv.id})">
          <div class="list-content">
            <div class="list-title">${inv.number}</div>
            <div class="list-subtitle">${escapeHtml(getClientName(inv.clientId))} · ${inv.date}</div>
          </div>
          <div class="list-meta" style="font-weight:700;color:var(--success)">$${inv.total.toFixed(2)}</div>
        </div>
      `).join('');
    }

    function viewInvoice(id) {
      const inv = data.invoices.find(x => x.id === id);
      if (!inv) return;
      const client = data.clients.find(c => c.id === inv.clientId) || { name: 'Cliente', email: '', phone: '' };

      const html = `
        <div class="invoice-preview invoice-print" id="print-area">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
            <div>
              <h2 style="font-size:1.5rem;margin:0">Fiend</h2>
              <p style="color:#64748b;margin:4px 0 0;font-size:0.85rem">Servicios académicos</p>
            </div>
            <div style="text-align:right">
              <strong style="font-size:1.1rem">${inv.number}</strong><br>
              <span style="color:#64748b">${inv.date}</span>
            </div>
          </div>
          <div style="margin-bottom:20px;padding:12px;background:#f8fafc;border-radius:8px">
            <strong>Cliente:</strong> ${escapeHtml(client.name)}<br>
            ${client.email ? 'Email: ' + escapeHtml(client.email) + '<br>' : ''}
            ${client.phone ? 'Tel: ' + escapeHtml(client.phone) : ''}
          </div>
          <table>
            <thead>
              <tr><th>Concepto</th><th style="text-align:right">Importe</th></tr>
            </thead>
            <tbody>
              ${inv.items.map(i => `
                <tr>
                  <td>${escapeHtml(i.title)}</td>
                  <td style="text-align:right">$${i.price.toFixed(2)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div style="text-align:right;font-size:1.2rem;font-weight:700;margin-top:12px">
            Total: $${inv.total.toFixed(2)}
          </div>
          ${inv.notes ? `<p style="margin-top:16px;color:#64748b;font-size:0.85rem"><em>${escapeHtml(inv.notes)}</em></p>` : ''}
          <p style="margin-top:24px;font-size:0.75rem;color:#94a3b8;text-align:center">Generado con Fiend · Documento local</p>
        </div>
      `;
      document.getElementById('invoice-content').innerHTML = html;
      openModal('modal-view-invoice');
    }

    function printInvoice() {
      window.print();
    }

    // ==================== UTILS ====================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fiend-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Datos exportados');
    }

    // ==================== INIT ====================
    loadData();
    renderDashboard();

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal(overlay.id);
      });
    });
  </script>
</body>
</html>
