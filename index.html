<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fiend — Sistema de Servicios</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      border: none;
      background: none;
      cursor: pointer;
      transition: color 0.2s;
      min-width: 64px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    .main {
      padding: 16px;
      padding-bottom: 90px;
      max-width: 640px;
      margin: 0 auto;
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
    }

    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      width: auto;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:active {
      background: var(--bg-hover);
    }

    .list-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a;
      flex-shrink: 0;
    }

    .list-content {
      flex: 1;
      min-width: 0;
    }

    .list-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-pending { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .badge-process { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .badge-ready { background: rgba(52, 211, 153, 0.15); color: var(--success); }
    .badge-done { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-hover);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }

    .invoice-preview {
      background: white;
      color: #1e293b;
      padding: 24px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .invoice-preview h2 {
      color: #0f172a;
      margin-bottom: 4px;
    }

    .invoice-preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }

    .invoice-preview th, .invoice-preview td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .invoice-preview th {
      font-weight: 600;
      color: #64748b;
      font-size: 0.8rem;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box input {
      padding-left: 40px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    @media (min-width: 640px) {
      .nav {
        max-width: 640px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 16px 16px 0 0;
      }
    }

    @media print {
      body * { visibility: hidden; }
      .invoice-print, .invoice-print * { visibility: visible; }
      .invoice-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
        color: black;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">F</div>
      <span>Fiend</span>
    </div>
    <button class="btn-icon" onclick="exportData()" title="Exportar datos">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </header>

  <main class="main">
    <div id="page-dashboard" class="page active">
      <div class="stats-grid">
        <div class="card">
          <div class="card-title">Clientes</div>
          <div class="card-value" id="stat-clients">0</div>
        </div>
        <div class="card">
          <div class="card-title">Servicios</div>
          <div class="card-value" id="stat-services">0</div>
        </div>
        <div class="card">
          <div class="card-title">En proceso</div>
          <div class="card-value" id="stat-process" style="color: var(--primary)">0</div>
        </div>
        <div class="card">
          <div class="card-title">Ingresos</div>
          <div class="card-value" id="stat-revenue" style="color: var(--success)">$0</div>
        </div>
      </div>

      <div class="section-header">
        <h2 class="section-title">Servicios recientes</h2>
        <button class="btn btn-sm btn-primary" onclick="openServiceModal()">+ Nuevo</button>
      </div>
      <div id="recent-services"></div>
    </div>

    <div id="page-clients" class="page">
      <div class="section-header">
        <h2 class="section-title">Clientes</h2>
        <button class="btn btn-sm btn-primary" onclick="openClientModal()">+ Agregar</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="form-input" id="search-clients" placeholder="Buscar cliente..." oninput="renderClients()">
      </div>
      <div id="clients-list"></div>
    </div>

    <div id="page-services" class="page">
      <div class="section-header">
        <h2 class="section-title">Servicios / Tareas</h2>
        <button class="btn btn-sm btn-primary" onclick="openServiceModal()">+ Nuevo</button>
      </div>
      <div class="status-pills">
        <button class="pill active" data-status="all" onclick="filterServices('all', this)">Todos</button>
        <button class="pill" data-status="pending" onclick="filterServices('pending', this)">Pendiente</button>
        <button class="pill" data-status="process" onclick="filterServices('process', this)">En proceso</button>
        <button class="pill" data-status="ready" onclick="filterServices('ready', this)">Listo</button>
        <button class="pill" data-status="done" onclick="filterServices('done', this)">Entregado</button>
      </div>
      <div id="services-list"></div>
    </div>

    <div id="page-invoices" class="page">
      <div class="section-header">
        <h2 class="section-title">Facturas</h2>
        <button class="btn btn-sm btn-primary" onclick="openInvoiceModal()">+ Crear</button>
      </div>
      <div id="invoices-list"></div>
    </div>
  </main>

  <nav class="nav">
    <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Inicio
    </button>
    <button class="nav-item" data-page="clients" onclick="navigate('clients')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Clientes
    </button>
    <button class="nav-item" data-page="services" onclick="navigate('services')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      Servicios
    </button>
    <button class="nav-item" data-page="invoices" onclick="navigate('invoices')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Facturas
    </button>
  </nav>

  </script>
</body>
</html>
